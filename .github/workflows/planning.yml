name: Planning application checks
on:
  push:
    branches: [main, feat/payanam-web]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r requirements-planning.txt pytest==8.3.4 pytest-asyncio==0.25.0 httpx==0.28.1
      - run: python -m pytest tests/planning -q
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start API and wait for health
        run: |
          python -m uvicorn app.planning.main:app --host 127.0.0.1 --port 8000 > /tmp/payanam-api.log 2>&1 &
          python - <<'PY'
          import time, urllib.request
          for attempt in range(20):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)
                  break
              except OSError:
                  time.sleep(1)
          else:
              raise SystemExit('Planning API did not become healthy')
          PY
      - run: npm test -- --workers=1
        working-directory: frontend
